# SQLite single-replica deployment WITH Litestream WAL replication sidecar.
#
# Use this variant when running on SQLite (no DATABASE_URL) but wanting
# real-time disaster recovery of the DB to S3/MinIO. Litestream streams the
# WAL to s3://deepthink-litestream/messages every ~1s.
#
# Single replica + Recreate strategy: SQLite is single-writer; do NOT scale
# this beyond 1. For multi-writer horizontal scaling use deployment.yaml (PG).
#
# Apply: kubectl apply -k deploy/k8s/sqlite-litestream/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepthink
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
    app.kubernetes.io/component: web-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deepthink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepthink
        app.kubernetes.io/component: web-server
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 0
      containers:
        - name: deepthink
          image: deepthink-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef: { name: deepthink-config }
            - secretRef: { name: deepthink-secret }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5 && kill -TERM 1"] }
        - name: litestream
          image: litestream/litestream:0.3.13
          args: ["replicate"]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: deepthink-secret, key: S3_ACCESS_KEY_ID } }
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: deepthink-secret, key: S3_SECRET_ACCESS_KEY } }
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: deepthink-data }
        - name: litestream-config
          configMap: { name: litestream-config }
