# Kustomize bundle for DeepThink K8s deployment (multi-replica mode)
# Usage:
#   kubectl apply -k deploy/k8s/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  labels:
    app.kubernetes.io/name: deepthink
    app.kubernetes.io/version: "2.0"

namespace: deepthink

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml.example
  - pvc.yaml
  - redis.yaml
  - postgres.yaml
  - minio.yaml
  - litestream-config.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - agent-runner.yaml
  - backup-cronjob.yaml
