apiVersion: v1
kind: ConfigMap
metadata:
  name: deepthink-config
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
data:
  # ─── Runtime ─────────────────────────────────
  DEEPTHINK_DATA_DIR: "/data"
  WEB_PORT: "9898"
  TZ: "Asia/Shanghai"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # ─── Web / Proxy ────────────────────────────
  TRUST_PROXY: "true"
  # CORS_ALLOWED_ORIGINS: "https://deepthink.example.com"
  MAX_FILE_SIZE_MB: "50"

  # ─── Agent Runtime ──────────────────────────
  # Phase 1: host mode (no Docker-in-Docker in K8s)
  CONTAINER_IMAGE: "deepthink-agent:latest"
  # MAX_CONCURRENT_HOST_PROCESSES: "5"

  # ─── Database ───────────────────────────────
  # Leave empty to use SQLite (default, Phase 1)
  # Set to postgres://user:pass@host:5432/deepthink for PostgreSQL (Phase 2)
  DATABASE_URL: ""

  # ─── Redis (Phase 2 — leave empty for single-replica) ──
  REDIS_URL: ""
