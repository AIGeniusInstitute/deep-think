# Backup CronJob — daily disaster-recovery backup.
#
# PG mode (DATABASE_URL set): runs `pg_dump | gzip` against the PostgreSQL
# service, writing a compressed logical dump to the PVC. This is the cloud /
# multi-pod target. The image MUST ship pg_dump — postgres:16-alpine does.
# (Earlier this used deepthink-server:latest, a node image with no pg_dump, so
# the PG branch hit the "pg_dump missing" guard and silently skipped every
# night — the CronJob stayed green but produced zero backups.)
#
# SQLite mode (no DATABASE_URL): best-effort `cp` of messages.db + WAL/SHM.
# SQLite single-replica is not the cloud target; the node + better-sqlite3
# online .backup() path is unavailable in the postgres image, so cp is the
# pragmatic fallback.
#
# Requires a writable PVC (backup subdirectory) mounted at /data.
# DATABASE_URL is injected via the deepthink-secret (same as web-server).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: deepthink-backup
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
spec:
  schedule: "0 3 * * *"  # Daily at 03:00 local time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 0
          containers:
            - name: backup
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: deepthink-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  BACKUP_DIR="/data/backups"
                  mkdir -p "$BACKUP_DIR"
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  if [ -n "$DATABASE_URL" ]; then
                    # ── PostgreSQL (cloud / multi-pod) ──
                    BACKUP_FILE="$BACKUP_DIR/pg-${STAMP}.sql.gz"
                    echo "Backing up PostgreSQL to $BACKUP_FILE (pg_dump | gzip)..."
                    pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
                    echo "PostgreSQL backup complete: $BACKUP_FILE"
                  else
                    # ── SQLite (single-replica, non-cloud) ── best-effort cp
                    SRC="/data/db/messages.db"
                    if [ ! -f "$SRC" ]; then
                      echo "No SQLite database at $SRC — nothing to back up."
                      exit 0
                    fi
                    BACKUP_FILE="$BACKUP_DIR/messages-${STAMP}.db"
                    echo "Copying SQLite database to $BACKUP_FILE..."
                    cp "$SRC" "$BACKUP_FILE"
                    cp "$SRC-wal" "$BACKUP_FILE-wal" 2>/dev/null || true
                    cp "$SRC-shm" "$BACKUP_FILE-shm" 2>/dev/null || true
                    echo "SQLite backup complete: $BACKUP_FILE"
                  fi
                  # Retention: keep only the last 7 backups (any type)
                  ls -1t "$BACKUP_DIR"/*.db "$BACKUP_DIR"/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -v
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: deepthink-data
