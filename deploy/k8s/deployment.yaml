apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepthink
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
    app.kubernetes.io/component: web-server
spec:
  # Multi-replica mode: 2+ replicas for horizontal scaling.
  # Safe because: (a) PostgreSQL handles concurrent writes,
  # (b) Redis provides distributed locks for scheduler/IM,
  # (c) WebSocket broadcasts propagate via Redis pub/sub.
  # For single-replica mode (SQLite only): set replicas: 1, strategy: Recreate.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: deepthink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepthink
        app.kubernetes.io/component: web-server
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 0
      containers:
        - name: deepthink
          image: deepthink-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          envFrom:
            - configMapRef:
                name: deepthink-config
            - secretRef:
                name: deepthink-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
          # Startup probe: PG-mode cold start creates 59 tables through the
          # worker-thread sync bridge, which can take over a minute. The
          # startup probe (up to 30×10s = 300s) prevents liveness from killing
          # the pod during this initial schema build.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5 && kill -TERM 1"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepthink-data
