apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deepthink-data
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
spec:
  # Multi-replica mode: ReadWriteMany (RWX) — requires NFS/CephFS/EFS StorageClass.
  # All pods share the same volume for workspace files (groups/sessions/skills/etc.).
  # Single-replica mode: change to ReadWriteOnce (RWO).
  accessModes:
    - ReadWriteMany
  # storageClassName: nfs-client  # Uncomment and set to your RWX storage class
  resources:
    requests:
      storage: 100Gi
